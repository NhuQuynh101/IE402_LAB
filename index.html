<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>BTTH2-Nhom5</title>

    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.15/esri/themes/light/main.css"
    />
    <script src="https://js.arcgis.com/4.15/"></script>

    <style>
      html,
      body,
      #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
    </style>

    <script>
      require([
        "esri/Map",
        "esri/views/SceneView",
        "esri/layers/GraphicsLayer",
        "esri/geometry/Mesh",
        "esri/geometry/Point",
        "esri/Graphic"
      ], function (
        Map,
        SceneView,
        GraphicsLayer,
        Mesh,
        Point,
        Graphic
      ) {
        const sketchLayer = new GraphicsLayer({
          elevationInfo: {
            mode: "absolute-height"
          },
          title: "Sketched geometries"
        });

        const map = new Map({
          basemap: "topo-vector",
          ground: "world-elevation"
        });

        const view = new SceneView({
          container: "viewDiv",
          map: map,
          camera: {
            position: {
              x: 106.802366, 
              y: 10.871718, 
              z: 130
            },
            heading: 180,
            tilt: 70
          }
        });

        const houseLocation = new Point({
          x: 106.802649,  
          y: 10.869819, 
          z: 26
        });


        Mesh.createFromGLTF(houseLocation, "./UIT.glb")
          .then(function (geometry) {
            geometry.scale(0.9, { origin: houseLocation });  
            geometry.rotate(0, 0, 90);  
            const graphic = new Graphic({
              geometry: geometry,
              symbol: {
                type: "mesh-3d",
                symbolLayers: [{
                  type: "fill"
                }]
              },
              attributes: {
                Name: "Tòa nhà E - Trường Đại học Công nghệ Thông tin, ĐHQG TP.HCM",
                "Số tầng": "12",
                "Chiều cao": "46m",
                "Diện tích xây dựng": "8600 m²",
                "Tổng diện tích sàn": "8600 m²",
                "Mã GIS": "UIT-E-001",
                "Địa chỉ": "Khu phố 6, phường Linh Trung, TP. Thủ Đức, TP. HCM",
                "Thông tin xây dựng": "Đây là tòa nhà có 12 tầng nổi, 01 tầng hầm, 01 tầng kỹ thuật, chiều cao công trình 46m, khung sàn BTCT toàn khối. Mỗi khoa 1 tầng, 4 tầng đầu tiên là phòng học cho CTTT, CLC."
              },
              popupTemplate: {
                title: "{Name}",
                content: `
                  <table>
                    <tr><td><b>Số tầng</b></td><td>{Số tầng}</td></tr>
                    <tr><td><b>Chiều cao</b></td><td>{Chiều cao}</td></tr>
                    <tr><td><b>Diện tích xây dựng</b></td><td>{Diện tích xây dựng}</td></tr>
                    <tr><td><b>Tổng diện tích sàn</b></td><td>{Tổng diện tích sàn}</td></tr>
                    <tr><td><b>Mã GIS</b></td><td>{Mã GIS}</td></tr>
                    <tr><td><b>Địa chỉ</b></td><td>{Địa chỉ}</td></tr>
                  </table>
                  <p><b>Thông tin xây dựng:</b> {Thông tin xây dựng}</p>`
              }
              
            });
            sketchLayer.add(graphic);
          })
          .catch(console.error);

        map.add(sketchLayer);
      });
    </script>
  </head>

  <body>
    <div id="viewDiv"></div>
  </body>
</html>
